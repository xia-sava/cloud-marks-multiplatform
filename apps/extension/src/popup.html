<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
  <script type="module" src="popup.js"></script>
</head>
<body>
  <div id="previous-failure" class="notice error" role="alert" hidden>
    <p id="previous-failure-heading"></p>
    <p id="previous-failure-message"></p>
  </div>
  <form id="form">
    <p id="tab-count"></p>
    <fieldset id="controls">
      <div class="actions">
        <label><input type="radio" name="action" value="addFolder"><span id="label-add-folder"></span></label>
        <label><input type="radio" name="action" value="addBookmarks"><span id="label-add-bookmarks"></span></label>
      </div>
      <div class="field">
        <label>
          <span id="folder-label"></span>
          <select id="folder"></select>
        </label>
        <p id="folder-status" role="status"></p>
      </div>
      <label class="field">
        <span id="name-label"></span>
        <input type="text" id="name" autocomplete="off">
      </label>
      <div class="buttons">
        <button type="submit" id="ok"></button>
        <button type="button" id="cancel"></button>
      </div>
    </fieldset>
    <p id="status" role="status"></p>
    <p id="error" class="error" role="alert"></p>
  </form>
  <button type="button" id="open-app" class="text-button"></button>
</body>
</html>
